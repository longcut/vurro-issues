name: 🐛 Bug Report · Mobile app (Android/iOS)
description: Report something that isn't working in the Vurro Android or iOS app.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug! Please fill out the details below so we can investigate.
        Before submitting, please [search existing issues](../../issues) to avoid duplicates.

        **Using the browser extension?** Go back and choose the **🐛 Bug Report · Browser extension** template instead.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which app are you using?
      options:
        - Android app
        - iOS app
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: Describe the problem…
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Open '…'
        2. Tap on '…'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### Environment

  - type: input
    id: device
    attributes:
      label: Device
      description: The phone or tablet you're using.
      placeholder: e.g., Pixel 8, iPhone 15 Pro, iPad Air
    validations:
      required: true

  - type: input
    id: os_version
    attributes:
      label: OS version
      description: Your Android or iOS version.
      placeholder: e.g., Android 14, iOS 17.4
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: Vurro app version
      description: Found in the app's settings/about screen or your app store listing.
      placeholder: e.g., 1.2.0
    validations:
      required: true

  - type: input
    id: substack
    attributes:
      label: Substack URL (if applicable)
      description: Does this happen on a specific Substack or all of them?
      placeholder: e.g., https://example.substack.com
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Drag and drop screenshots or screen recordings here if they help illustrate the problem.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Any other information that might be relevant.
    validations:
      required: false
